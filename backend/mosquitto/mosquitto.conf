# Development broker: plain MQTT on 1883, no login.
# Fine on a local network for phase 1 — switch to the TLS listener before real deployment.
listener 1883
allow_anonymous true

# --- Production (spec: MQTT over TLS on 8883) ---
# Put the certificates in backend/mosquitto/certs/ (git-ignored), mount that folder
# in docker-compose.yml, expose port 8883, and replace the block above with:
#
# listener 8883
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# allow_anonymous false
# password_file /mosquitto/config/passwd
